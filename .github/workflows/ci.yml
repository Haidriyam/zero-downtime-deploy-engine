name: Deploy Engine CI

on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Shell Scripts
        run: |
          chmod +x scripts/deploy.sh
          bash -n scripts/deploy.sh

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build All Services
        run: |
          docker compose build

      - name: Boot Cluster and Test Zero-Downtime Swap
        run: |
          docker compose up -d
          sleep 5

          echo "Checking initial blue response..."
          curl -s http://localhost/health | grep -q "blue"

          echo "Switching upstream to green..."
          bash scripts/deploy.sh green
          sleep 2

          echo "Verifying traffic switched to green..."
          for i in {1..5}; do
            RESP=$(curl -s http://localhost/health)
            echo "Probe response: $RESP"
            if echo "$RESP" | grep -q "green"; then
              echo "Traffic switch confirmed to green!"
              break
            fi
            sleep 1
          done

          # Final assertion
          curl -s http://localhost/health | grep -q "green"

          docker compose down
