name: Deploy Engine CI

on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Shell Scripts
        run: |
          chmod +x scripts/deploy.sh
          bash -n scripts/deploy.sh

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build All Services
        run: |
          docker compose build

      - name: Boot Cluster and Test Zero-Downtime Swap
        run: |
          docker compose up -d
          
          echo "Waiting for reverse proxy and blue service..."
          for i in {1..15}; do
            if curl -s http://localhost/health | grep -q "blue"; then
              echo "Blue service is healthy!"
              break
            fi
            sleep 1
          done

          # Trigger swap to green
          bash scripts/deploy.sh green

          echo "Waiting for green service transition..."
          SUCCESS=0
          for i in {1..15}; do
            RESPONSE=$(curl -s http://localhost/health || true)
            if echo "$RESPONSE" | grep -q "green"; then
              echo "Green service is healthy and serving traffic!"
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Failed to route to green service. Last response: $RESPONSE"
            docker logs reverse_proxy
            docker compose down
            exit 1
          fi

          docker compose down
