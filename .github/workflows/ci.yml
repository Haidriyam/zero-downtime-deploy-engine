name: Deploy Engine CI

on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Initialize Services
        run: docker compose up -d --build

      - name: Health Probe Verification (Blue Pool)
        run: |
          for i in {1..15}; do
            if curl -s http://localhost/ | grep -q "blue"; then
              echo "Primary pool (blue) successfully responding!"
              break
            fi
            sleep 1
          done

      - name: Canary Verification (Green Target Routing)
        run: |
          RESPONSE=$(curl -s -H "X-Route-Target: green" http://localhost/)
          echo "Green Target Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "green"

      - name: Teardown
        if: always()
        run: docker compose down