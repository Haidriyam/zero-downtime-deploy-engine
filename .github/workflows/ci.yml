name: Deploy Engine CI

on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Shell Scripts
        run: |
          chmod +x scripts/deploy.sh
          bash -n scripts/deploy.sh

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build All Services
        run: |
          docker compose build

      - name: Boot Cluster and Test Zero-Downtime Swap
        run: |
          docker compose up -d
          # Give containers sufficient initialization window
          for i in {1..10}; do
            if curl -s http://localhost/health | grep -q "blue"; then
              echo "Blue service is healthy and responding!"
              break
            fi
            sleep 2
          done
          
          # Execute upstream switch to green
          bash scripts/deploy.sh green
          sleep 3

          # Verify green response
          curl -s http://localhost/health | grep -q "green"
          echo "Green service switch verified with zero downtime!"
          docker compose down
