events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS resolver with 2-second caching
    resolver 127.0.0.11 valid=2s;

    server {
        listen 80;

        location / {
            # Default to active pool; override via header for staging checks
            set $upstream_target app_blue;
            if ($http_x_route_target = "green") {
                set $upstream_target app_green;
            }

            proxy_pass http://$upstream_target:8080;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location /health {
            proxy_pass http://app_blue:8080;
        }
    }
}