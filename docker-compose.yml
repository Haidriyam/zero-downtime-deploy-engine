version: '3.8'

services:
  reverse_proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_blue
    restart: always

  app_blue:
    build:
      context: ./app
    container_name: app_blue
    environment:
      - PORT=8080
      - APP_VERSION=1.0.0
      - APP_COLOR=blue
    expose:
      - "8080"
    restart: always

  app_green:
    build:
      context: ./app
    container_name: app_green
    environment:
      - PORT=8080
      - APP_VERSION=2.0.0
      - APP_COLOR=green
    expose:
      - "8080"
    restart: always