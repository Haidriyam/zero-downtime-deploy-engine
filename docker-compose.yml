version: '3.8'

services:
  reverse_proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_blue
      - app_green
    restart: always

  app_blue:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app_blue
    environment:
      - APP_COLOR=blue
      - APP_VERSION=1.0.0
    expose:
      - "8080"
    restart: always

  app_green:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app_green
    environment:
      - APP_COLOR=green
      - APP_VERSION=2.0.0
    expose:
      - "8080"
    restart: always